name: certification-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: certification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Reproducible install
        run: npm ci --ignore-scripts

      - name: Certification checks
        run: npm run check

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Verify SBOM is non-empty
        run: test -s sbom.cdx.json

      - name: Validate digest-only deployment policy
        run: |
          node scripts/verify-image-ref.mjs "ghcr.io/example/card-club@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" >/dev/null
          if node scripts/verify-image-ref.mjs "ghcr.io/example/card-club:latest"; then exit 1; fi

  postgres-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_PASSWORD: certification-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Reproducible adapter dependencies
        run: npm ci --ignore-scripts

      - name: Apply ledger schema
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < db/001_ledger_core.sql

      - name: Apply verified-settlement receipt schema
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < db/002_settlement_receipts.sql

      - name: Apply atomic settlement-commit schema
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < db/003_settlement_commit.sql

      - name: Replay, fencing, isolation and append-only evidence
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < test/postgres-ledger.sql

      - name: Settlement receipt idempotency and outcome-binding evidence
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < test/postgres-settlement-receipt.sql

      - name: Atomic settlement-to-ledger, custody and crash/retry evidence
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < test/postgres-settlement-commit.sql

      - name: Production-style Node PostgreSQL adapter end-to-end evidence
        env:
          PG_INTEGRATION_URL: postgresql://postgres:certification-only@127.0.0.1:5432/postgres
        run: node --test test/postgres-adapter.integration.test.js

  migration-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_PASSWORD: certification-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Expand, backfill, contract and rollback evidence
        run: ./test/migration-cycle.sh "${{ job.services.postgres.id }}"

  container-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --pull --tag card-club-certification:test .

      - name: Run with production hardening controls
        run: |
          cid=$(docker run -d \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -p 127.0.0.1:18080:8080 \
            card-club-certification:test)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz | grep -q '"ok":true'; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:18080/healthz | grep -q '"ok":true'
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = "node"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$cid" | grep -q 'ALL'
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$cid" | grep -q 'no-new-privileges'

  provenance:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build runtime artifact
        run: |
          docker build --pull --tag card-club-certification:attested .
          docker save --output card-club-runtime.tar card-club-certification:attested
          sha256sum card-club-runtime.tar

      - name: Generate signed SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: card-club-runtime.tar

      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify card-club-runtime.tar
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          --source-digest "$GITHUB_SHA"
